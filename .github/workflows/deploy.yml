
name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t project-deployment:latest .

      - name: Deploy Container
        run: |
          docker stop project-deployment-container || true
          docker rm project-deployment-container || true
          docker run -d -p 8082:80 --name project-deployment-container project-deployment:latest
