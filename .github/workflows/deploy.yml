name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/project-deployment:latest" .

      - name: Push Image to Docker Hub
        run: |
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/project-deployment:latest"

      - name: Setup SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 10.0.2.3 >> ~/.ssh/known_hosts

      - name: Deploy on Deployment Server
        run: |
          ssh aqsa@10.0.2.3 "
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/project-deployment:latest
            docker stop project-deployment-container || true
            docker rm project-deployment-container || true
            docker run -d -p 8082:80 --name project-deployment-container ${{ secrets.DOCKERHUB_USERNAME }}/project-deployment:latest
          "